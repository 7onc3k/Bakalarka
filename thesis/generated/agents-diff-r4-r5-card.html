<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
html, body {
  margin: 0;
  padding: 0;
  background: #ffffff;
  overflow: hidden;
}
body {
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
  color: #1f2937;
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
}
.frame {
  padding: 12px;
}
.card {
  border: 1px solid #d8dee6;
  border-radius: 10px;
  overflow: hidden;
  background: #ffffff;
}
.header {
  background: #f6f8fb;
  border-bottom: 1px solid #d8dee6;
  padding: 10px 16px;
  font: 600 22px/1.25 'IBM Plex Sans', system-ui, sans-serif;
  color: #1f2937;
}
.content {
  padding: 10px 16px 14px;
}
pre {
  margin: 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-family: 'IBM Plex Mono', Menlo, Consolas, 'Liberation Mono', monospace;
  font-size: 32px;
  line-height: 1.45;
  color: #1f2937;
}
.line {
  display: block;
  padding: 0 6px;
  border-radius: 4px;
}
.add {
  background: #e8f5e9;
}
.del {
  background: #fdecec;
}

</style>
</head>
<body>
  <div class="frame">
    <div class="card">
      <div class="header">AGENTS.md: pilot-r4 -&gt; pilot-r5 (proposal)</div>
      <div class="content"><pre></pre></div>
    </div>
  </div>
</body>
</html>
